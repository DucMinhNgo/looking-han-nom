# Tra cứu Hán-Nôm — one service, no database.
#
#   docker compose up -d --build
#   docker compose logs -f lookup
#
# Out of the box this serves the 10-item sample, so the app is usable the
# moment it starts. Point the ./sample mount at your own folder when you have
# one: adding rows or pictures afterwards needs no restart.

services:
  lookup:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      cache:
        condition: service_healthy

    env_file: .env
    # env_file:
    #   # Generate it with:  python -m app.cli --init-env
    #   #
    #   # required: false so `docker compose up` still starts without it — the
    #   # app then prints exactly which keys are missing, which is a far better
    #   # first experience than Compose refusing to read its own file.
    #   - path: .env
    #     required: false

    # Pinned here rather than left to .env: these are the paths *inside* the
    # container, and a .env written for running without Docker would otherwise
    # point the app at host paths that do not exist in here.
    environment:
      DATA_DIR: /data
      DATASET_PATH: /srv/src/dataset.jsonl
      IMAGES_DIR: /srv/src
      USERS_PATH: /srv/src/users.json
      GROUP_TAGS_JSON: '{"group1":"549457308456387","group2":"322453387859386","data1":"549457308456387"}'
      # Optional. Without it, the Qwen button reports that no key is configured.
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-vl-max}
      # Optional extra focused domains; general web search always runs.
      QWEN_SEARCH_SITES_JSON: '${QWEN_SEARCH_SITES_JSON:-[]}'
      REDIS_URL: ${REDIS_URL:-redis://cache:6379/0}

    # Bound to loopback: a reverse proxy terminates TLS for the public domain
    # and forwards here.
    ports:
      - "9080:8000"

    volumes:
      # Accounts live here and must survive a container replacement.
      - ./data:/data
      - /media:/media
      - /media/khtn/hdd/crawling:/srv/src

      # The dataset and the pictures. Point this at your own folder; it needs
      # a dataset.jsonl and an images/ beside it.
      #
      # NOT read-only: admins can add rows and pictures through the web, which
      # rewrites dataset.jsonl and writes into images/. Add `:ro` back if you
      # want a strictly read-only deployment — the upload buttons will then
      # fail with a message saying exactly that.
      #
      # A DIRECTORY on purpose, never `- ./sample/dataset.jsonl:/srv/src/...`.
      # Bind-mounting a single file pins its inode, so an editor that saves by
      # writing a temp file and renaming it over the original leaves the
      # container staring at the old content until it is recreated. Mounting
      # the folder has no such trap: adding, editing and replacing all show up.
      #
      # Set DATA_SOURCE in .env to point somewhere else without editing this
      # file:  DATA_SOURCE=D:/du-lieu-han-nom
      # - ${DATA_SOURCE:-./sample}:/srv/src

    deploy:
      resources:
        limits:
          memory: 2g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
