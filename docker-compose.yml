# Tra cứu Hán-Nôm — full stack với PostgreSQL, pgAdmin và Nginx.
#
#   docker compose up -d --build
#
# Sau khi stack chạy, import dữ liệu:
#   docker compose exec lookup python scripts/import_jsonl.py /srv/src/dataset.jsonl
#
# Truy cập:
#   http://localhost          → App tra cứu
#   http://localhost/pgadmin  → pgAdmin 4

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-hannom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hannom_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-hannom}
    volumes:
      # Data volume — giữ dữ liệu khi restart container
      - postgres_data:/var/lib/postgresql/data
      # Init script — chạy một lần khi volume mới được tạo
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Expose ra host để kết nối trực tiếp từ tool ngoài Docker (tùy chọn)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hannom} -d ${POSTGRES_DB:-hannom}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── pgAdmin 4 ───────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@hannom.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      # Serve tại /pgadmin để Nginx proxy đúng path
      SCRIPT_NAME: /pgadmin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    # Không expose ra ngoài trực tiếp — truy cập qua Nginx
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis cache ─────────────────────────────────────────────────────────────
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── FastAPI lookup app ──────────────────────────────────────────────────────
  lookup:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_healthy

    env_file: .env

    environment:
      DATA_DIR:      /data
      DATASET_PATH:  /srv/src/dataset.jsonl
      IMAGES_DIR:    /srv/src
      USERS_PATH:    /srv/src/users.json
      GROUP_TAGS_JSON: '{"group1":"549457308456387","data1":"549457308456387","group2":"322453387859386","data2":"322453387859386"}'

      # PostgreSQL
      DATABASE_URL: postgresql://${POSTGRES_USER:-hannom}:${POSTGRES_PASSWORD:-hannom_secret}@postgres:5432/${POSTGRES_DB:-hannom}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB:   ${POSTGRES_DB:-hannom}
      POSTGRES_USER: ${POSTGRES_USER:-hannom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hannom_secret}

      # Redis
      REDIS_URL: ${REDIS_URL:-redis://cache:6379/0}

      # Qwen (optional)
      QWEN_API_KEY:          ${QWEN_API_KEY:-}
      QWEN_BASE_URL:         ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL:            ${QWEN_MODEL:-qwen-vl-max}
      QWEN_SEARCH_SITES_JSON: '${QWEN_SEARCH_SITES_JSON:-[]}'

    volumes:
      - ./data:/data
      - /media:/media
      - /media/khtn/hdd/crawling:/srv/src
      # Script import chạy từ trong container
      - ./scripts:/srv/scripts:ro

    # Không expose trực tiếp — traffic đến qua Nginx
    # Bỏ comment dòng dưới nếu cần debug trực tiếp:
    # ports:
    #   - "9080:8000"

    deploy:
      resources:
        limits:
          memory: 2g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - lookup
      - pgadmin
    ports:
      - "9080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  pgadmin_data:
