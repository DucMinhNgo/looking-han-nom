###############################################################################
# Hán-Nôm — Nginx reverse proxy
#
# Routes:
#   /          → FastAPI lookup app  (lookup:8000)
#   /pgadmin/  → pgAdmin 4           (pgadmin:80)
###############################################################################

upstream lookup_app {
    server lookup:8000;
    keepalive 32;
}

upstream pgadmin_app {
    server pgadmin:80;
    keepalive 8;
}

# ── Rate limiting ─────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # Max upload size — phù hợp với việc upload ảnh / JSONL
    client_max_body_size 200M;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/json application/javascript text/css
               text/xml image/svg+xml;
    gzip_min_length 1024;

    # ── Lookup app ────────────────────────────────────────────────────────────
    location / {
        limit_req zone=api burst=60 nodelay;

        proxy_pass         http://lookup_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout  120s;
        proxy_send_timeout  120s;

        # Tắt buffering cho streaming responses (nếu có)
        proxy_buffering off;
    }

    # ── pgAdmin ───────────────────────────────────────────────────────────────
    location /pgadmin/ {
        proxy_pass         http://han-nom-app_adminer_1:8080/; # Hoặc tên service/container Adminer trong docker-compose của bạn
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # ── Health check endpoint (for load balancer / monitoring) ────────────────
    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
